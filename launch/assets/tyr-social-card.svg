<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tyr research preview</title>
  <desc id="desc">A dark social card reading Dependently typed machine learning in Lean 4, with a tensor shape transformation and compile-time checked label.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="130" r="230" fill="#22d3ee" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1260" cy="760" r="300" fill="#8b5cf6" opacity="0.10" filter="url(#glow)"/>
  <rect x="92" y="82" width="1416" height="736" rx="34" fill="#0f172a" fill-opacity="0.72" stroke="#334155" stroke-width="2"/>
  <text x="150" y="194" fill="url(#accent)" font-family="Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="6">TYR</text>
  <text x="150" y="315" fill="#f8fafc" font-family="Inter, Helvetica, Arial, sans-serif" font-size="74" font-weight="750">Dependently typed</text>
  <text x="150" y="402" fill="#f8fafc" font-family="Inter, Helvetica, Arial, sans-serif" font-size="74" font-weight="750">machine learning</text>
  <text x="154" y="474" fill="#94a3b8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38">A research preview built in Lean 4</text>
  <rect x="150" y="558" width="900" height="148" rx="22" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="194" y="622" fill="#67e8f9" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="33">#[32, 768] × #[512, 768]</text>
  <text x="194" y="674" fill="#c4b5fd" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="33">→ #[32, 512]</text>
  <rect x="1100" y="576" width="326" height="92" rx="46" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/>
  <path d="M1150 622 l18 18 34-40" fill="none" stroke="#5eead4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1224" y="635" fill="#ccfbf1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700">checked</text>
  <rect x="150" y="759" width="1290" height="4" rx="2" fill="url(#accent)"/>
</svg>
