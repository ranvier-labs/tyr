<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tyr BranchingFlows training loss</title>
  <desc id="desc">A line chart showing anchor loss falling from 1.484375 at step zero to 0.000481 after training.</desc>
  <rect width="1200" height="720" fill="#08111f"/>
  <text x="92" y="88" fill="#f8fafc" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">A Tyr model learns end to end</text>
  <text x="92" y="132" fill="#94a3b8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24">Continuous BranchingFlows launch demo · anchor loss</text>
  <rect x="92" y="180" width="1016" height="410" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <g stroke="#334155" stroke-width="1">
    <line x1="160" y1="230" x2="1040" y2="230"/>
    <line x1="160" y1="330" x2="1040" y2="330"/>
    <line x1="160" y1="430" x2="1040" y2="430"/>
    <line x1="160" y1="530" x2="1040" y2="530"/>
  </g>
  <g fill="#94a3b8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="112" y="237">1.5</text>
    <text x="112" y="337">1.0</text>
    <text x="112" y="437">0.5</text>
    <text x="112" y="537">0.0</text>
    <text x="153" y="566">0</text>
    <text x="389" y="566">20</text>
    <text x="625" y="566">40</text>
    <text x="861" y="566">60</text>
  </g>
  <polyline points="160,233 395,452 630,520 865,530 1040,530" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#a78bfa" stroke="#f8fafc" stroke-width="3">
    <circle cx="160" cy="233" r="9"/>
    <circle cx="395" cy="452" r="9"/>
    <circle cx="630" cy="520" r="9"/>
    <circle cx="865" cy="530" r="9"/>
    <circle cx="1040" cy="530" r="9"/>
  </g>
  <text x="930" y="495" fill="#ccfbf1" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">0.000481</text>
  <text x="92" y="654" fill="#cbd5e1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27">1.484375 → 0.000481</text>
  <text x="1108" y="654" fill="#64748b" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" text-anchor="end">verified locally</text>
